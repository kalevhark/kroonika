{% load wiki_extras %}
{% with model=obj|get_model_name %}
  {% if qs %}
    <ul class="w3-padding ul-seotud">
      {{ label }}:
      {% for obj in qs %}
        <li class="li-seotud">
          &nbsp;
          <a
                  class="hover-{{ model }} tooltip-content"
                  href="{{ obj.get_absolute_url }}"
          >
            <span
            title='{{ obj }}'
            data-model='{{ obj|get_model_name }}'
            data-id='{{ obj.id }}'
            id='{{ obj|get_model_name }}_{{ obj.id }}'
            >
              {{ obj }}
            </span>
          </a>
        </li>
      {% endfor %}
    </ul>
  {% endif %}
{% endwith %}
